# This yml file:
# 1. performs unique and not_null tests in the ID columns of oulined tables
# 2. Makes a relationship between fct_sales.CustomerID and dim_customer.CustomerID
# 
version: 2

models:
  - name: fct_sales
    description: "Central transactional fact table sales across products."
    columns:
      - name: SalesOrderDetailID
        tests:
          - unique
          - not_null
      - name: CustomerID
        tests:
          - relationships:
              to: ref('dim_customer')
              field: CustomerID

  - name: dim_customer
    description: "Customer dimension table containing unique customer IDs. This connected to the address table with the bridge table called bridge_customer_address"
    columns:
      - name: CustomerID
        tests:
          - unique
          - not_null

  - name: dim_address
    description: "Master geography dimension table containing unique physical address components."
    columns:
      - name: AddressID
        tests:
          - unique
          - not_null

  - name: bridge_customer_address
    description: "Many-to-many bridge table mapping customer IDs to multiple addresses."
    columns:
      - name: CustomerID
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: CustomerID
      - name: AddressID
        tests:
          - not_null
          - relationships:
              to: ref('dim_address')
              field: AddressID