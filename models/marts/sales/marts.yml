# This yml file:
# 1. performs unique and not_null tests in the ID columns of oulined tables
# 2. Defines a relationship between fct_sales.CustomerID and dim_customer.CustomerID
# 3. Defines a relationship between bridge_customer_address.CustomerID and dim_customer.CustomerID
# 4. Defines a relationship between bridge_customer_address.CustomerID and dim_address.AddressID
#
version: 2

models:
  - name: fct_sales
    description: "Central transactional fact table sales across products."
    columns:
      - name: SalesOrderDetailID
        tests:
          - unique
          - not_null
      - name: CustomerID
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: CustomerID

  - name: dim_customer
    description: "Customer dimension table containing unique customer IDs. This connected to the address table with the bridge table called bridge_customer_address"
    columns:
      - name: CustomerID
        tests:
          - unique
          - not_null

  - name: dim_address
    description: "Master geography dimension table containing unique physical addresses."
    columns:
      - name: AddressID
        tests:
          - unique
          - not_null

  - name: bridge_customer_address
    description: "Bridge table mapping customer IDs to multiple addresses. This addresses the many-to-many relationship issues with tables dim_address and dim_customer"
    columns:
      - name: CustomerID
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: CustomerID
      - name: AddressID
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_address')
                field: AddressID
